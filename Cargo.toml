# Modified from OpenAI Codex (codex-rs/Cargo.toml @ 806d973): trimmed to the crates ether copies.
[workspace]
members = [
    "crates/utils/absolute-path",
    "crates/utils/string",
    "crates/utils/stream-parser",
    "crates/utils/fuzzy-match",
    "crates/utils/cache",
    "crates/utils/process",
    "crates/utils/redacted-string",
    "crates/async-utils",
    "crates/ansi-escape",
    "crates/file-search",
    "crates/process-hardening",
    "crates/uds",
    "crates/bwrap",
    "crates/utils/pty",
    "crates/utils/path-uri",
    "crates/utils/home-dir",
    "crates/utils/path-utils",
    "crates/extension-items",
    "crates/execpolicy",
    "crates/utils/image",
    "crates/protocol",
    "crates/utils/output-truncation",
    "crates/file-system",
    "crates/shell-command",
    "crates/history",
    "crates/context-fragments",
    "crates/git-utils",
    "crates/apply-patch",
    "crates/codex-client",
    "crates/model-provider-info",
    "crates/sandboxing",
    "crates/linux-sandbox",
    "crates/tools",
    "crates/rollout",
    "crates/llm",
    "crates/engine",
    "crates/cli",
    "crates/tui",
    "crates/ui-spec",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# Copied Codex crates (original package names).
codex-utils-absolute-path = { path = "crates/utils/absolute-path" }
codex-utils-string = { path = "crates/utils/string" }
codex-utils-stream-parser = { path = "crates/utils/stream-parser" }
codex-utils-fuzzy-match = { path = "crates/utils/fuzzy-match" }
codex-utils-cache = { path = "crates/utils/cache" }
codex-utils-process = { path = "crates/utils/process" }
codex-utils-redacted-string = { path = "crates/utils/redacted-string" }
codex-async-utils = { path = "crates/async-utils" }
codex-ansi-escape = { path = "crates/ansi-escape" }
codex-file-search = { path = "crates/file-search" }
codex-process-hardening = { path = "crates/process-hardening" }
codex-uds = { path = "crates/uds" }
codex-bwrap = { path = "crates/bwrap" }
codex-utils-pty = { path = "crates/utils/pty" }
codex-utils-path-uri = { path = "crates/utils/path-uri" }
codex-utils-home-dir = { path = "crates/utils/home-dir" }
codex-utils-path = { path = "crates/utils/path-utils" }
codex-extension-items = { path = "crates/extension-items" }
codex-execpolicy = { path = "crates/execpolicy" }
codex-utils-image = { path = "crates/utils/image" }
codex-protocol = { path = "crates/protocol" }
codex-utils-output-truncation = { path = "crates/utils/output-truncation" }
codex-file-system = { path = "crates/file-system" }
codex-shell-command = { path = "crates/shell-command" }
codex-history = { path = "crates/history" }
codex-context-fragments = { path = "crates/context-fragments" }
codex-git-utils = { path = "crates/git-utils" }
codex-apply-patch = { path = "crates/apply-patch" }
codex-client = { path = "crates/codex-client" }
codex-model-provider-info = { path = "crates/model-provider-info" }
codex-sandboxing = { path = "crates/sandboxing" }
codex-linux-sandbox = { path = "crates/linux-sandbox" }
codex-tools = { path = "crates/tools" }
codex-rollout = { path = "crates/rollout" }


# New ether crates.
ether-engine = { path = "crates/engine" }
ether-llm = { path = "crates/llm" }
ether-tui = { path = "crates/tui" }
ether-ui-spec = { path = "crates/ui-spec" }
# External crates, with the same specs as Codex's workspace.
ansi-to-tui = "8.0.1"
anyhow = "1"
base64 = "0.22.1"
bitflags = "2.13.1"
bytes = "1.10.1"
chardetng = "0.1.17"
chrono = "0.4.43"
clap = "4"
crossbeam-channel = "0.5.15"
crossterm = "0.29.0"
derive_more = "2"
diffy = "0.4.2"
dirs = "6"
dunce = "1.0.4"
encoding_rs = "0.8.35"
eventsource-stream = "0.2.3"
futures = { version = "0.3", default-features = false }
gix = { version = "0.81.0", default-features = false, features = ["sha1"] }
gix-url = "0.35.2"
globset = "0.4"
http = "1.3.1"
httpdate = "1.0.3"
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
ignore = "0.4.23"
image = { version = "^0.25.9", default-features = false }
itertools = "0.14.0"
jsonptr = { version = "0.7.1", default-features = false }
landlock = "0.4.4"
libc = "0.2.182"
lru = "0.18.2"
memchr = "2.7.6"
mime_guess = "2.0.5"
multimap = "0.10.0"
nucleo = { git = "https://github.com/helix-editor/nucleo.git", rev = "4253de9faabb4e5c6d81d946a5e35a90f87347ee" }
once_cell = "1.20.2"
pathdiff = "0.2"
portable-pty = "0.9.0"
pulldown-cmark = { version = "0.10", default-features = false }
quick-xml = "0.41.0"
rand = "0.9"
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
] }
ratatui-macros = "0.7.2"
regex = "1.12.3"
regex-lite = "0.1.8"
reqwest = { version = "0.12", features = ["cookies"] }
rmcp = { git = "https://github.com/modelcontextprotocol/rust-sdk", rev = "3e636cab26c013eca5131103c03d20237f12c4df", version = "=3.3.0", default-features = false }
rustix = { version = "1.1.4", features = ["net"] }
schemars = "0.8.22"
seccompiler = "0.5.0"
serde = { version = "1", features = ["rc"] }
serde_json = "1"
serde_with = "3.17"
sha1 = "0.10.6"
sha2 = "0.10"
shlex = "1.3.0"
similar = "2.7.0"
starlark = { version = "0.14.2", default-features = false }
strum = "0.27.2"
strum_macros = "0.28.0"
supports-color = "3.0.2"
sys-locale = "0.3.2"
tempfile = "3.23.0"
textwrap = "0.16.2"
thiserror = "2.0.17"
time = "0.3.47"
tokio = "1"
tokio-util = "0.7.18"
toml = "0.9.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
ts-rs = "11"
unicode-segmentation = "1.12.0"
unicode-width = "0.2"
url = "2"
urlencoding = "2.1"
uuid = "1"
walkdir = "2.5.0"
which = "8"
wildmatch = "2.6.1"
zstd = "0.13"

[workspace.lints]
rust = {}

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
disallowed_methods = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[profile.dev]
# The test profile inherits dev. Keep source locations in ordinary builds;
# use CARGO_PROFILE_DEV_DEBUG=full (or CARGO_PROFILE_TEST_DEBUG=full) for locals.
debug = "line-tables-only"

[profile.release]
lto = "thin"
debug = "line-tables-only"
split-debuginfo = "off"
# Keep release binaries symbolicateable until packaging has archived the
# sidecar symbols and stripped the binaries.
strip = false

# Balance parallel release code generation against binary size.
codegen-units = 4

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
