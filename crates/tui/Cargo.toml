# Modified from OpenAI Codex (codex-rs/tui/Cargo.toml @ 806d973): `ether-tui`, only the dependencies of the lifted rendering modules.
[package]
edition.workspace = true
license.workspace = true
name = "ether-tui"
version.workspace = true

[lib]
doctest = false
test = false

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
codex-ansi-escape = { workspace = true }
codex-git-utils = { workspace = true }
codex-protocol = { workspace = true }
codex-shell-command = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-path-uri = { workspace = true }
codex-utils-string = { workspace = true }
crossterm = { workspace = true, features = ["bracketed-paste", "event-stream"] }
derive_more = { workspace = true, features = ["is_variant"] }
diffy = { workspace = true }
dirs = { workspace = true }
ether-engine = { workspace = true }
ether-ui-spec = { workspace = true }
futures = { workspace = true }
image = { workspace = true, features = ["png"] }
itertools = { workspace = true }
libc = { workspace = true }
pathdiff = { workspace = true }
pulldown-cmark = { workspace = true, features = ["html"] }
rand = { workspace = true }
regex-lite = { workspace = true }
ratatui = { workspace = true, features = [
    "scrolling-regions",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
ratatui-macros = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
shlex = { workspace = true }
supports-color = { workspace = true }
syntect = { version = "5", default-features = false, features = ["parsing", "plist-load", "regex-onig"] }
textwrap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
