# Modified from OpenAI Codex (codex-rs/file-system/Cargo.toml @ 806d973): added the dependencies of the local implementation ported from exec-server.
[package]
name = "codex-file-system"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-path-uri = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["fs"] }

[lib]
test = false
doctest = false
