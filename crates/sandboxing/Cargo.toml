# Modified from OpenAI Codex (codex-rs/sandboxing/Cargo.toml @ 806d973): removed Windows-only dependencies, dev-dependencies; removed codex-mxc-sandbox, codex-network-proxy and codex-windows-sandbox.
[package]
name = "codex-sandboxing"
